name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extras: [dev, 'align,dev', 'train,align,dev']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[${{ matrix.extras }}]"
      - run: scus-pretrain --help
      - run: scus --help
      - run: pytest
